[project]
name = "python-developer-lab"
version = "0.1.0"
description = "Local-first Python learning and software engineering lab"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "pydantic-settings>=2.6", "jinja2>=3.1", "httpx>=0.27", "python-multipart>=0.0.9"]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.8", "pyright>=1.1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
