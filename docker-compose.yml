services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: python-developer-lab:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_NAME: Python Developer Lab
      DATABASE_URL: sqlite:///./data/app.db
      EXECUTION_TIMEOUT_SECONDS: 3
      MAX_OUTPUT_BYTES: 12000
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\", timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  app-data:
